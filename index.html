<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16222C">
<title>高画質化</title>
<style>
:root{--paper:#E9EDEF;--ink:#16222C;--mute:#566772;--line:#BFCAD1;--acc:#0B6E7F;--ok:#2F7D4F;--warn:#B5651D;--bad:#A8431F}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,"Noto Sans JP","Hiragino Sans",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;letter-spacing:.04em;margin:8px 0 2px}
.lead{color:var(--mute);margin:0 0 20px;font-size:14px}
section{border-top:1px solid var(--line);padding:16px 0}
h2{font-size:15px;margin:0 0 8px}
dl{display:grid;grid-template-columns:5.5em 1fr;gap:4px 8px;margin:0 0 16px;font-size:14px}
dt{color:var(--mute)}
dd{margin:0}
dd::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.5em;background:var(--mute)}
dd[data-s=ok]::before{background:var(--ok)}
dd[data-s=warn]::before{background:var(--warn)}
dd[data-s=bad]::before{background:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #7FC4D1;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],select{min-height:44px;width:100%;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font:inherit;color:inherit}
label.f{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
details{margin-top:10px;font-size:14px}
summary{cursor:pointer;color:var(--mute);min-height:32px}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
progress{width:100%;height:10px;accent-color:var(--acc);margin:12px 0 4px}
#msg{min-height:1.6em;font-size:14px;margin:10px 0 0}
#msg.err{color:var(--bad)}
.cmp{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;border:1px solid var(--line);background:repeating-conic-gradient(#d5dce0 0 25%,#e9edef 0 50%) 0 0/16px 16px}
.cmp canvas{display:block;width:100%;height:auto}
.cmp canvas.bf{position:absolute;inset:0;width:100%;height:100%}
.cmp .bar{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
.cmp .tag{position:absolute;top:8px;padding:2px 8px;background:rgba(22,34,44,.82);color:#fff;font-size:12px;border-radius:4px;pointer-events:none}
</style>
</head>
<body>
<main>
<h1>高画質化</h1>
<p class="lead">画像を4倍に拡大します。処理はこの端末の中だけで行います。</p>

<dl>
  <dt>GPU</dt><dd id="s-gpu" data-s="">確認中</dd>
  <dt>モデル</dt><dd id="s-model" data-s="">確認中</dd>
  <dt>オフライン</dt><dd id="s-off" data-s="">確認中</dd>
</dl>

<section>
  <h2>モデル</h2>
  <div class="row">
    <button class="btn pri" id="getModel">モデルを取得</button>
    <label class="btn" for="modelFile">ファイルから読み込む</label>
    <input type="file" id="modelFile" accept=".onnx" hidden>
  </div>
  <progress id="dlp" max="1" value="0" hidden></progress>
  <details>
    <summary>取得元を変更</summary>
    <label class="f" for="modelUrl">モデルのURL(.onnx)</label>
    <input type="text" id="modelUrl" inputmode="url" spellcheck="false">
    <p class="note">入力・出力が 0〜1 の RGB(NCHW)で、4倍に拡大する ONNX モデルが使えます。</p>
  </details>
</section>

<section>
  <h2>画像</h2>
  <div class="row">
    <label class="btn" for="imgFile">画像を選ぶ</label>
    <input type="file" id="imgFile" accept="image/*" hidden>
  </div>
  <label class="f" for="maxSide">入力の長辺の上限</label>
  <select id="maxSide">
    <option value="512">512px(速い)</option>
    <option value="768">768px</option>
    <option value="1024" selected>1024px</option>
    <option value="1536">1536px(遅い・メモリを多く使う)</option>
  </select>
  <p class="note" id="info">画像が未選択です。</p>
</section>

<section>
  <h2>実行</h2>
  <div class="row">
    <button class="btn pri" id="run" disabled>高画質化を実行</button>
    <button class="btn" id="cancel" hidden>中断</button>
  </div>
  <progress id="pg" max="1" value="0" hidden></progress>
  <div id="msg" role="status" aria-live="polite"></div>
</section>

<section id="result" hidden>
  <h2>結果</h2>
  <div class="cmp" id="cmp">
    <span class="tag" style="left:8px">元</span>
    <span class="tag" style="right:8px">拡大後</span>
    <div class="bar" id="bar"></div>
  </div>
  <p class="note">画像の上を左右になぞると、元画像と拡大後を見比べられます。</p>
  <div class="row" style="margin-top:10px">
    <button class="btn pri" id="save">PNGで保存</button>
  </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.webgpu.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const ORT_BASE = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/';
const RUNTIME = [ORT_BASE + 'ort.webgpu.min.js', ORT_BASE + 'ort-wasm-simd-threaded.jsep.mjs', ORT_BASE + 'ort-wasm-simd-threaded.jsep.wasm'];
const DEFAULT_URL = 'https://huggingface.co/qualcomm/Real-ESRGAN-General-x4v3/resolve/main/Real-ESRGAN-General-x4v3.onnx';
const MODEL_CACHE = 'up-model-v1', SHELL_CACHE = 'up-v1';

let session = null, backend = '', T = 128, bmp = null, outCanvas = null, ac = null;

function setS(id, text, s) { const e = $('#s-' + id); e.textContent = text; e.dataset.s = s || ''; }
function msg(t, err) { const m = $('#msg'); m.textContent = t; m.className = err ? 'err' : ''; }
const fmtT = (s) => s >= 60 ? Math.floor(s / 60) + '分' + Math.round(s % 60) + '秒' : Math.round(s) + '秒';
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

/* ---------- 準備 ---------- */
if (window.ort) { ort.env.wasm.wasmPaths = ORT_BASE; ort.env.wasm.numThreads = 1; }
$('#modelUrl').value = ls.get('modelUrl') || DEFAULT_URL;
setS('gpu', navigator.gpu ? 'WebGPU を利用できます' : 'WebGPU なし(CPUで動くため非常に遅い)', navigator.gpu ? 'ok' : 'warn');
if (!window.ort) { setS('model', '実行ライブラリを読み込めません。オンラインで開き直してください', 'bad'); $('#getModel').disabled = true; }

async function offlineReady() {
  try {
    for (const u of RUNTIME) if (!(await caches.match(u, { ignoreVary: true }))) return false;
    return !!ls.get('modelKey') && !!(await (await caches.open(MODEL_CACHE)).match(ls.get('modelKey')));
  } catch { return false; }
}
async function refreshOffline() {
  if (!('serviceWorker' in navigator)) return setS('off', 'この環境では使えません(HTTPSで開いてください)', 'bad');
  const ok = await offlineReady();
  setS('off', ok ? '準備できています(通信なしで動きます)' : 'まだです(オンラインでモデル取得まで進めてください)', ok ? 'ok' : 'warn');
}
async function warm() {
  if (!navigator.onLine || !window.ort) return;
  const c = await caches.open(SHELL_CACHE);
  for (const f of RUNTIME) { if (!(await c.match(f))) { try { await c.add(f); } catch {} } }
  refreshOffline();
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(warm).catch(() => refreshOffline());
} else refreshOffline();

/* ---------- モデル ---------- */
async function download(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('モデルを取得できませんでした(HTTP ' + res.status + ')');
  const total = +res.headers.get('content-length') || 0, rd = res.body.getReader(), parts = [];
  let got = 0; const p = $('#dlp'); p.hidden = false; p.removeAttribute('value');
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    parts.push(value); got += value.length;
    if (total) p.value = got / total;
    setS('model', '取得中 ' + (got / 1048576).toFixed(1) + ' MB' + (total ? ' / ' + (total / 1048576).toFixed(1) + ' MB' : ''), 'warn');
  }
  p.hidden = true;
  return new Blob(parts);
}
async function putCache(key, blob) {
  try { navigator.storage?.persist?.(); await (await caches.open(MODEL_CACHE)).put(key, new Response(blob)); ls.set('modelKey', key); } catch { msg('モデルを端末に保存できませんでした(今回のみ使えます)', true); }
}
async function useModel(blob, label) {
  setS('model', '読み込み中…', 'warn');
  const bytes = new Uint8Array(await blob.arrayBuffer());
  try { session = await ort.InferenceSession.create(bytes, { executionProviders: ['webgpu'] }); backend = 'GPU'; }
  catch { session = await ort.InferenceSession.create(bytes, { executionProviders: ['wasm'] }); backend = 'CPU'; }
  T = 128;
  try {
    const m = session.inputMetadata, d = (Array.isArray(m) ? m[0] : m[session.inputNames[0]])?.shape;
    if (d && typeof d[2] === 'number' && d[2] > 0) T = d[2];
  } catch {}
  setS('model', label + '(' + backend + ' / タイル ' + T + 'px)', backend === 'GPU' ? 'ok' : 'warn');
  updateRun(); refreshOffline();
}
$('#getModel').onclick = async () => {
  try {
    const url = $('#modelUrl').value.trim(); ls.set('modelUrl', url);
    const blob = await download(url); await putCache(url, blob); await useModel(blob, '取得済み');
  } catch (e) { $('#dlp').hidden = true; setS('model', '失敗', 'bad'); msg(e.message, true); }
};
$('#modelFile').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { await putCache('local:' + f.name, f); await useModel(f, f.name); } catch (er) { setS('model', '失敗', 'bad'); msg('モデルを読み込めません: ' + er.message, true); }
};
(async () => {
  const key = ls.get('modelKey');
  if (!key) return setS('model', '未取得(約5MB)', 'warn');
  try {
    const hit = await (await caches.open(MODEL_CACHE)).match(key);
    if (!hit) return setS('model', '未取得(約5MB)', 'warn');
    await useModel(await hit.blob(), '保存済み');
  } catch (e) { setS('model', '読み込めません', 'bad'); msg(e.message, true); }
})();

/* ---------- 画像 ---------- */
function sizes() {
  if (!bmp) return null;
  const s = Math.min(1, +$('#maxSide').value / Math.max(bmp.width, bmp.height));
  return { w: Math.round(bmp.width * s), h: Math.round(bmp.height * s) };
}
function updateInfo() {
  const z = sizes(); if (!z) return;
  $('#info').textContent = '入力 ' + z.w + '×' + z.h + ' → 出力 ' + z.w * 4 + '×' + z.h * 4;
}
function updateRun() { $('#run').disabled = !(session && bmp) || !!ac; }
$('#maxSide').onchange = updateInfo;
$('#imgFile').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { bmp = await createImageBitmap(f); updateInfo(); msg(''); updateRun(); }
  catch { bmp = null; msg('この画像を開けませんでした', true); }
};

/* ---------- 拡大 ---------- */
const cl = (v) => v <= 0 ? 0 : v >= 1 ? 255 : (v * 255 + 0.5) | 0;
async function upscale(onP, signal) {
  const { w, h } = sizes(), SC = 4, P = 10, S = T - 2 * P;
  const src = document.createElement('canvas'); src.width = w; src.height = h;
  const sx = src.getContext('2d', { willReadFrequently: true }); sx.drawImage(bmp, 0, 0, w, h);
  const sd = sx.getImageData(0, 0, w, h).data;
  const out = document.createElement('canvas'); out.width = w * SC; out.height = h * SC;
  const ox = out.getContext('2d');
  const nx = Math.ceil(w / S), ny = Math.ceil(h / S), total = nx * ny, TT = T * T, OT = T * SC;
  const inName = session.inputNames[0], outName = session.outputNames[0], buf = new Float32Array(3 * TT);
  let n = 0;
  for (let ty = 0; ty < ny; ty++) for (let tx = 0; tx < nx; tx++) {
    if (signal.aborted) throw new Error('cancel');
    const x0 = tx * S - P, y0 = ty * S - P;
    for (let y = 0; y < T; y++) {
      const yy = Math.min(h - 1, Math.max(0, y0 + y));
      for (let x = 0; x < T; x++) {
        const xx = Math.min(w - 1, Math.max(0, x0 + x)), i = (yy * w + xx) * 4, j = y * T + x;
        buf[j] = sd[i] / 255; buf[TT + j] = sd[i + 1] / 255; buf[2 * TT + j] = sd[i + 2] / 255;
      }
    }
    const r = await session.run({ [inName]: new ort.Tensor('float32', buf, [1, 3, T, T]) });
    const o = r[outName];
    if (o.type !== 'float32' || o.dims[2] !== OT) throw new Error('このモデルの出力形式には未対応です(float32・4倍のモデルを使ってください)');
    const od = o.data, cw = Math.min(S, w - tx * S), ch = Math.min(S, h - ty * S);
    const im = ox.createImageData(cw * SC, ch * SC), d = im.data;
    for (let y = 0; y < ch * SC; y++) for (let x = 0; x < cw * SC; x++) {
      const j = (P * SC + y) * OT + (P * SC + x), k = (y * cw * SC + x) * 4;
      d[k] = cl(od[j]); d[k + 1] = cl(od[OT * OT + j]); d[k + 2] = cl(od[2 * OT * OT + j]); d[k + 3] = 255;
    }
    ox.putImageData(im, tx * S * SC, ty * S * SC);
    o.dispose?.();
    onP(++n, total);
  }
  return { src, out };
}

$('#run').onclick = async () => {
  ac = new AbortController(); updateRun();
  $('#cancel').hidden = false; $('#result').hidden = true;
  const pg = $('#pg'); pg.hidden = false; pg.value = 0;
  let lock = null; try { lock = await navigator.wakeLock?.request('screen'); } catch {}
  const t0 = performance.now();
  try {
    const { src, out } = await upscale((n, total) => {
      const el = (performance.now() - t0) / 1000;
      pg.value = n / total;
      msg(n + ' / ' + total + ' タイル(残り約 ' + fmtT(el / n * (total - n)) + ')。画面を点けたままにしてください。');
    }, ac.signal);
    outCanvas = out; showResult(src, out);
    msg('完了しました(' + fmtT((performance.now() - t0) / 1000) + ')。');
  } catch (e) {
    msg(e.message === 'cancel' ? '中断しました。' : 'エラー: ' + e.message, e.message !== 'cancel');
  } finally {
    try { lock?.release(); } catch {}
    ac = null; $('#cancel').hidden = true; pg.hidden = true; updateRun();
  }
};
$('#cancel').onclick = () => ac && ac.abort();

/* ---------- 結果 ---------- */
const cmp = $('#cmp'), bar = $('#bar');
function setPos(v) { v = Math.min(100, Math.max(0, v)); bar.style.left = v + '%'; const b = cmp.querySelector('.bf'); if (b) b.style.clipPath = 'inset(0 ' + (100 - v) + '% 0 0)'; }
function showResult(src, out) {
  cmp.querySelectorAll('canvas').forEach((c) => c.remove());
  out.className = 'af'; src.className = 'bf';
  cmp.prepend(src); cmp.prepend(out); setPos(50);
  $('#result').hidden = false; $('#result').scrollIntoView({ behavior: 'smooth' });
}
const at = (e) => { const r = cmp.getBoundingClientRect(); setPos((e.clientX - r.left) / r.width * 100); };
cmp.addEventListener('pointerdown', (e) => { cmp.setPointerCapture(e.pointerId); at(e); });
cmp.addEventListener('pointermove', (e) => { if (cmp.hasPointerCapture(e.pointerId)) at(e); });
$('#save').onclick = () => {
  if (!outCanvas) return;
  outCanvas.toBlob((b) => {
    if (!b) return msg('保存用の画像を作れませんでした', true);
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'upscaled.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }, 'image/png');
};
</script>
</body>
</html>
